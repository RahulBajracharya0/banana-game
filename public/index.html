<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Banana Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Banana Game</h1>
  <p>Player: <span id="username"></span> <button id="logout">Log out</button></p>
  <p>Score: <span id="score">0</span> | Time left: <span id="timer">30</span>s</p>

  <img id="puzzle" alt="Puzzle" width="400">
  <br>
  <input type="number" id="answer" placeholder="Your answer">
  <button id="submit">Submit</button>
  <p id="message"></p>

  <script src="game.js"></script>
</body>
</html>
